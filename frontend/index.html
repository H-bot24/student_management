<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
        <h1 class="text-4xl font-extrabold mb-8 text-center text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 drop-shadow-sm">
            <i class="fa-solid fa-graduation-cap text-sky-500 mr-3"></i>Student Management System
        </h1>
        
        <div class="flex flex-col md:flex-row gap-10">
            <!-- Left Column -->
            <div class="w-full md:w-1/3 flex flex-col gap-8 self-start">
                
                <!-- Add Student Form -->
                <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-sky-400">
                    <h2 class="text-xl font-bold mb-6 text-gray-800 flex items-center">
                        <div class="bg-sky-100 p-2 rounded-lg mr-3 text-sky-500">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        Add New Student
                    </h2>
                    <form id="student-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Name</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-user text-gray-400"></i>
                                </div>
                                <input type="text" id="name" required placeholder="e.g. John Doe" class="pl-10 mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Course</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-book-open text-gray-400"></i>
                                </div>
                                <input type="text" id="course" required placeholder="e.g. Computer Science" class="pl-10 mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Marks</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-check text-gray-400"></i>
                                </div>
                                <input type="number" id="marks" required placeholder="e.g. 85" class="pl-10 mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition">
                            </div>
                        </div>
                        
                        <div class="pt-2">
                            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-sky-400 to-blue-500 text-white font-semibold px-4 py-2.5 rounded-lg shadow-md hover:shadow-lg hover:from-sky-500 hover:to-blue-600 transition transform hover:-translate-y-0.5">
                                <i class="fa-solid fa-plus mr-2"></i>Add Student
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Find Student Box -->
                <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-emerald-400">
                    <h2 class="text-xl font-bold mb-5 text-gray-800 flex items-center">
                        <div class="bg-emerald-100 p-2 rounded-lg mr-3 text-emerald-500">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        Find Student
                    </h2>
                    <div class="flex space-x-2">
                        <input type="number" id="search-id" placeholder="Enter ID..." class="flex-1 rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-emerald-400 focus:ring-2 focus:ring-emerald-200 transition">
                        <button onclick="searchStudent()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2.5 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                            Search
                        </button>
                    </div>
                    <div id="search-result" class="mt-4 hidden bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm text-gray-700">
                        <!-- Search results rendered here -->
                    </div>
                </div>

            </div>

            <!-- Students List -->
            <div class="w-full md:w-2/3 bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center">
                        <div class="bg-sky-100 p-2 rounded-lg mr-3 text-sky-500">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        Students List
                    </h2>
                    <button onclick="fetchStudents()" class="text-sm text-sky-500 hover:text-sky-700 hover:bg-sky-50 px-3 py-1.5 rounded-md transition flex items-center">
                        <i class="fa-solid fa-rotate-right mr-1.5"></i> Refresh
                    </button>
                </div>

                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-sky-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider"><i class="fa-solid fa-graduation-cap mr-1"></i> Course</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider"><i class="fa-solid fa-chart-line mr-1"></i> Marks</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider"><i class="fa-solid fa-bolt mr-1"></i> Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body" class="bg-white divide-y divide-gray-100">
                            <!-- Student rows will be injected here -->
                        </tbody>
                    </table>
                </div>
                <div id="loading" class="text-center py-8 text-gray-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-400 mb-2 block"></i>
                    Loading students...
                </div>
                <div id="empty-state" class="hidden text-center py-12 text-gray-500 bg-gray-50 rounded-lg mt-4 border border-dashed border-gray-300">
                    <i class="fa-solid fa-folder-open text-4xl text-gray-400 mb-3 block"></i>
                    No students found. Add one to get started!
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal with Glass Effect -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <!-- Blurred Backdrop -->
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-md transition-opacity" onclick="closeEditModal()"></div>
        
        <!-- Modal Content -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md relative z-10 transform transition-all border-t-4 border-sky-400">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
                <div class="bg-sky-100 p-2 rounded-lg mr-3 text-sky-500">
                    <i class="fa-solid fa-user-pen"></i>
                </div>
                Edit Student
            </h2>
            <form id="edit-student-form" class="space-y-5">
                <input type="hidden" id="edit-student-id">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="edit-name" required class="pl-10 mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Course</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-book-open text-gray-400"></i>
                        </div>
                        <input type="text" id="edit-course" required class="pl-10 mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Marks</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-check text-gray-400"></i>
                        </div>
                        <input type="number" id="edit-marks" required class="pl-10 mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2.5 border focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition">
                    </div>
                </div>
                
                <div class="flex space-x-3 pt-4">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-sky-400 to-blue-500 text-white font-semibold px-4 py-2.5 rounded-lg shadow-md hover:shadow-lg hover:from-sky-500 hover:to-blue-600 transition transform hover:-translate-y-0.5">
                        <i class="fa-solid fa-check mr-2"></i>Save Changes
                    </button>
                    <button type="button" class="flex-1 bg-gray-100 text-gray-700 font-semibold px-4 py-2.5 rounded-lg shadow-sm hover:bg-gray-200 transition" onclick="closeEditModal()">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
